services:
  weather-mcp:
    image: ${WEATHER_IMAGE:-robertclaros/weather-mcp:latest}
    container_name: weather-mcp-dev
    restart: unless-stopped
    ports:
      - "${WEATHER_PORT:-4001}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"